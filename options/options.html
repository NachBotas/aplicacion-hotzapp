<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HotZapp · Configuración</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <aside class="nav">
    <div class="brand"><span class="logo">⚡</span><b>HotZapp</b></div>
    <a href="#replies" data-sec="replies">⚡ Respuestas rápidas</a>
    <a href="#funnel" data-sec="funnel">📊 Embudo</a>
    <a href="#scheduled" data-sec="scheduled">⏰ Programados</a>
    <a href="#settings" data-sec="settings">⚙️ Ajustes</a>
    <div class="foot">Abrí <a href="https://web.whatsapp.com" target="_blank">WhatsApp Web</a> para usar el panel.</div>
  </aside>
  <main id="view"></main>

  <dialog id="editor">
    <form method="dialog" class="ed">
      <h2 id="ed-title">Nueva respuesta</h2>
      <div class="grid2">
        <label>Nombre<input id="ed-name" required placeholder="Ej: Precios"></label>
        <label>Atajo<input id="ed-short" placeholder="/precios"></label>
      </div>
      <p class="help">Variables: <code>{nombre}</code> <code>{nombre_completo}</code> <code>{saludo}</code> <code>{fecha}</code> <code>{hora}</code></p>
      <div id="ed-steps"></div>
      <div class="add-row">
        <span>Agregar paso:</span>
        <button type="button" class="btn ghost" data-add="text">📝 Texto</button>
        <button type="button" class="btn ghost" data-add="image">🖼️ Imagen</button>
        <button type="button" class="btn ghost" data-add="audio">🎤 Audio</button>
      </div>
      <div class="ed-actions">
        <button type="button" class="btn ghost" id="ed-cancel">Cancelar</button>
        <button type="button" class="btn" id="ed-save">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="../src/storage.js"></script>
  <script src="options.js"></script>
</body>
</html>
